name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"
            exit 1
          fi

      - name: Build the DMG
        run: scripts/make-dmg.sh

      - name: Extract release notes from the changelog
        run: |
          awk -v version="[$(cat VERSION)]" '
            index($0, "## " version) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NotchUtils-$(cat VERSION).dmg" \
            "dist/NotchUtils-$(cat VERSION).dmg.sha256" \
            --title "NotchUtils $(cat VERSION)" \
            --notes-file release-notes.md
