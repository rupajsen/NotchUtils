name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the notch
        2. Click...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NotchUtils version
      description: Shown in the Credits tab.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: 14-inch MacBook Pro (M1 Pro), macOS 27.0
    validations:
      required: true
